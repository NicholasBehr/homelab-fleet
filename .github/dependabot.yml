version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Zurich
    open-pull-requests-limit: 3
    groups:
      monthly-nix:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Zurich
    open-pull-requests-limit: 3

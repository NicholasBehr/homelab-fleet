name: Release reviewed main commit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
      - uses: nix-community/cache-nix-action@b16f249a0248efec86dd9d4224cb75f1ffa48bcc
        with:
          primary-key: nix-v1-linux-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-v1-linux-${{ hashFiles('flake.lock') }}-
          save: false
      - name: Require successful checks for the exact main commit and unused version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-ready
      - name: Package catalog images (Nix reuses exact cached outputs)
        run: nix develop .#ci --command scripts/release-assets
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "homelab-fleet v$version" --notes-file docs/release-notes.md

name: Release reviewed main commit
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant
        required: true
        type: choice
        options: [immich-bootstrap, immich, immich-recovery]
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
      - run: nix develop .#ci --command scripts/check
      - name: Package the exact dispatched commit
        env:
          VARIANT: ${{ inputs.variant }}
        run: nix develop .#ci --command scripts/release-assets "$VARIANT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Publish immutable commit release
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
        run: |
          gh release create "$VARIANT-$GITHUB_SHA" dist/* --target "$GITHUB_SHA" --title "$VARIANT $GITHUB_SHA" --notes "Exact commit build; verify artifact attestations and manifest before deployment."

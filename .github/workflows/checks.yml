name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
      - uses: nix-community/cache-nix-action@b16f249a0248efec86dd9d4224cb75f1ffa48bcc
        with:
          primary-key: nix-v1-linux-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-v1-linux-${{ hashFiles('flake.lock') }}-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 6G
      - name: Formatting, scripts and unit tests
        timeout-minutes: 10
        run: nix develop .#ci --command scripts/check lint
      - name: Evaluate all configurations
        timeout-minutes: 10
        run: nix develop .#ci --command scripts/check eval
      - name: Secret, Borg/PostgreSQL and mount tests
        timeout-minutes: 10
        run: nix develop .#ci --command scripts/check tests
      - name: Select changed derivations (fallback is all)
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci-plan --base "$BASE_COMMIT"
      - name: Build and validate changed systems, checks and images
        timeout-minutes: 40
        run: nix develop .#ci --command scripts/check selected .ci-plan.json
      - name: Preserve available outputs for cache reuse (no builds)
        run: python3 scripts/cache-roots

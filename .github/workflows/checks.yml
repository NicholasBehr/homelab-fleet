name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
      - name: Formatting, scripts and unit tests
        timeout-minutes: 15
        run: nix develop .#ci --command scripts/check lint
      - name: Evaluate configurations
        timeout-minutes: 15
        run: nix develop .#ci --command scripts/check eval
      - name: Secret, Borg/PostgreSQL and mount tests
        timeout-minutes: 15
        run: nix develop .#ci --command scripts/check tests
      - name: Build NixOS systems
        timeout-minutes: 15
        run: nix develop .#ci --command scripts/check systems
      - name: Build bootstrap LXC template
        timeout-minutes: 15
        run: nix develop .#ci --command scripts/check image immich-bootstrap
      - name: Build operational LXC template
        timeout-minutes: 15
        run: nix develop .#ci --command scripts/check image immich
      - name: Build recovery LXC template
        timeout-minutes: 15
        run: nix develop .#ci --command scripts/check image immich-recovery
